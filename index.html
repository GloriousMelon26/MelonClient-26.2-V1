<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonClient + EaglerForge</title>
    
    <!-- External stylesheet directory for screen constraints -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 1. Core EaglerForge API Framework (Required for Modding) -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- 2. Your Custom MelonClient Logo Splash Screen -->
    <div id="melon-splash-screen">
        <img src="melonclient.png" alt="MelonClient Logo" class="splash-image">
    </div>

    <!-- 3. Dynamic Mod HUD (Displays coordinates and compass heading) -->
    <div id="melon-hud-coords" style="position: fixed; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.6); color: #6ee153; padding: 10px 15px; font-family: monospace; font-size: 14px; font-weight: bold; border-radius: 4px; border: 2px solid #6ee153; z-index: 9999; pointer-events: none; text-shadow: 1px 1px 2px #000;">
        XYZ: Calibrating Mod Engine...
    </div>

    <!-- 4. Native Game Canvas Engine Render Mount Container -->
    <div id="game-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- 5. Core Client Mod Scripts (Fullbright, Compass calculations, etc.) -->
    <script src="js/client.js"></script>

</body>
</html>
